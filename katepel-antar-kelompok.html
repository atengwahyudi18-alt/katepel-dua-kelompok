    :root{font-family:Arial,Helvetica,sans-serif;color:#17212b;background:#f1f5f6}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.bar{background:#075c47;color:white;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:1.05rem;font-weight:900;letter-spacing:.03em}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:800}.nav button{background:#08765a;color:white}.nav button.active{background:#f5a623;color:#17212b}.btn{background:#087f5b;color:white}.btn.secondary{background:#52616b}.btn.red{background:#b82a2a}.btn:disabled{opacity:.45;cursor:not-allowed}main{max-width:1120px;margin:18px auto;padding:0 14px 28px}.card{background:white;border-radius:15px;padding:20px;box-shadow:0 5px 20px #18302a12;margin-bottom:14px}.notice{background:#fff5d8;border:1px solid #edcb6c;color:#694d08;border-radius:10px;padding:12px 14px;margin-bottom:14px;line-height:1.4}.muted{color:#657480;line-height:1.5}.grid{display:grid;gap:12px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.manage-layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(280px,.9fr);gap:14px;align-items:stretch}.manage-card{margin:0}.import-title{font-size:1.35rem;font-weight:900;letter-spacing:.01em;margin:0 0 16px}.import-file{padding:11px;background:#f7f9fa;border:1px dashed #aab9c1;border-radius:10px}.bank-title{font-size:1.15rem;margin:20px 0 10px;padding-top:15px;border-top:1px solid #e2e8eb}.form-actions{margin-top:14px}h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 8px}h2{margin:0 0 9px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-weight:700;font-size:.9rem}.field input,.field textarea,.field select,.join input{width:100%;padding:10px;border:1px solid #ccd5da;border-radius:8px;background:#fff}.field textarea{min-height:78px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{justify-content:flex-end}.status{font-size:.9rem;color:#53616b;margin-top:9px}.question{font-size:clamp(1.2rem,2.7vw,1.8rem);line-height:1.38;margin:18px 0;padding:18px 20px;border-left:6px solid #075c47;border-radius:12px;background:#e4f2ed}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{padding:12px;border:2px solid #ffffffa0;border-radius:12px;line-height:1.4;color:#101318;font-weight:700;box-shadow:0 3px 8px #00000012}.choice:nth-child(1){background:#ef68b2}.choice:nth-child(2){background:#41d77a}.choice:nth-child(3){background:#589df0}.choice:nth-child(4){background:#f9933e}.choice b{color:#101318;margin-right:7px}.teamgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.team{border:2px solid #d6e0e4;border-radius:12px;padding:13px}.team.merah{border-color:#df2929;background:#ffe2e2}.team.kuning{border-color:#d1b900;background:#fff87a}.teamname{font-weight:900}.teamstate{margin-top:6px;color:#333}.score{font-weight:900;color:#075c47;margin-top:5px}.pill{background:#e4f2ed;color:#075c47;border-radius:999px;padding:8px 12px;font-weight:900}.join{display:flex;gap:8px}.questionlist{display:grid;gap:8px;max-height:430px;overflow:auto}.qrow{border:1px solid #d7e0e4;border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:start}.qrow p{margin:4px 0;font-size:.92rem}.answerpad{width:min(100%,440px);height:min(49vh,560px);min-height:270px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:9px;margin:3vh auto 0}.key{border:3px solid #ffffff90;border-radius:20px;color:#08090b;font-size:clamp(4.5rem,22vw,7rem);font-weight:1000;line-height:1;box-shadow:inset 0 3px 0 #ffffff55,inset 0 -5px 0 #00000012,0 6px 0 #00000025,0 12px 20px #00000020;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.key:nth-child(1){background:#ef68b2}.key:nth-child(2){background:#41d77a}.key:nth-child(3){background:#589df0}.key:nth-child(4){background:#f9933e}.key:active{transform:translateY(4px)}.key:disabled{filter:saturate(.45);opacity:.7}.phone{position:fixed;inset:0;background:#f20c0c;color:#090909;padding:calc(10px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:space-between}.phone.yellow{background:#fff400}.phone .mark{margin-top:1vh;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#075c47 0 43%,#ffc928 45% 57%,#188363 59% 72%,#ffc928 74%);border:3px solid #ffc928;color:white;font-size:2.2rem;font-weight:1000}.phone .wordmark{font-weight:1000;font-size:1.3rem;color:white;letter-spacing:.04em;text-shadow:0 2px 3px #0005;margin-top:5px}.phone.yellow .wordmark{color:#075c47;text-shadow:none}.phone .tagline{font-size:.48rem;color:#fff;font-weight:bold}.phone.yellow .tagline{color:#075c47}.instruction{text-align:center;font-weight:900;text-transform:uppercase;line-height:1.45;margin:8px 0 0}.bubble{font-size:2rem;margin-bottom:1vh}.phone-wait{min-height:100dvh;display:grid;place-items:center;padding:20px;text-align:center;background:#f4f6f7}.warning{color:#9b322b;font-weight:700}.toast{position:fixed;z-index:1000;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(92vw,540px);padding:12px 18px;border-radius:12px;background:#075c47;color:white;font-weight:800;box-shadow:0 8px 28px #0003}.toast.error{background:#a92b2b}.toast[hidden]{display:none}.app-credit{text-align:center;padding:18px 12px 24px;color:#657480;font-size:.88rem;font-weight:700;letter-spacing:.02em}.app-credit strong{color:#075c47}@media(max-width:760px){.manage-layout{grid-template-columns:1fr}}@media(max-width:650px){.bar{padding:10px}.card{padding:15px}main{margin:12px auto;padding:0 9px 20px}.cols2,.cols3{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.join{flex-direction:column}.teamgrid{grid-template-columns:1fr 1fr}.answerpad{height:45vh;gap:7px}.key{border-radius:16px}}
  body.projector-view #app .card {   padding-top: calc(20px * var(--projector-density, 1));   padding-bottom: calc(20px * var(--projector-density, 1)); }  body.projector-view #app .question {   margin-top: calc(18px * var(--projector-density, 1));   margin-bottom: calc(18px * var(--projector-density, 1));   padding-top: calc(18px * var(--projector-density, 1));   padding-bottom: calc(18px * var(--projector-density, 1)); }  body.projector-view #app .choices {   row-gap: calc(9px * var(--projector-density, 1)); }  body.projector-view #app .choice {   padding-top: calc(12px * var(--projector-density, 1));   padding-bottom: calc(12px * var(--projector-density, 1)); }  body.projector-view #app .teamgrid {   margin-top: calc(15px * var(--projector-density, 1));   row-gap: calc(10px * var(--projector-density, 1)); }  body.projector-view #app .team {   padding-top: calc(13px * var(--projector-density, 1));   padding-bottom: calc(13px * var(--projector-density, 1)); }  body.projector-view #app .teamstate {   margin-top: calc(6px * var(--projector-density, 1)); }  body.projector-view #app .score {   margin-top: calc(5px * var(--projector-density, 1)); }  body.projector-view #app .card > .row.right {   margin-top: calc(15px * var(--projector-density, 1)) !important; }  .zoom-controls {   display: flex;   align-items: center;   gap: 10px;   margin-top: 16px; }  .zoom-value {   min-width: 64px;   text-align: center;   font-size: 1.2rem;   font-weight: 900; }  </style>

<body>
  <header id="header" class="bar"><div class="brand">KATEPEL · KUIS ONLINE</div><nav class="nav"><button id="navQuestions" class="active">Kelola Soal</button><button id="navHost">Layar Proyektor</button><button id="navPhone">Layar HP</button><button id="navDisplay">Atur Tampilan</button><button id="navSettings">Sambungan</button></nav></header>
  <main id="app"></main>
  <section id="phoneRoot" hidden></section>
  <footer class="app-credit">KATEPEL • Dikembangkan oleh <strong>Ateng Wahyudi, S.Pd.</strong></footer>
  <script>
  (()=>{
    const $=id=>document.getElementById(id), LETTERS=['A','B','C','D'];
    const initialQuestions=[];
    let questions=load('katepel_unified_questions',initialQuestions), view='questions', client=null, channel=null, roomCode='', channelReady=false, status='Belum tersambung';
    let questionIndex=0, checked=false, finished=false;
    let teams=[{id:'merah',name:'Sudut Merah',answer:null,result:'waiting',score:0},{id:'kuning',name:'Sudut Kuning',answer:null,result:'waiting',score:0}];
    let phoneRoom='', phoneTeam='', phoneReady=false, phoneHasState=false, phoneLocked=false, phoneQuestionIndex=-1;
    let editingId=null;
    const cfgUrl=()=>localStorage.getItem('katepel_supabase_url')||'', cfgKey=()=>localStorage.getItem('katepel_supabase_key')||'';
    function load(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}}
    function saveQuestions(){localStorage.setItem('katepel_unified_questions',JSON.stringify(questions))}
    const oldDemoText='Apa masalah utama yang dihadapi Kancil dalam cerita?';
    const cleaned=questions.filter(q=>q.pertanyaan!==oldDemoText);
    if(cleaned.length!==questions.length){questions=cleaned;saveQuestions()}
    function toast(message,type='success'){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.className=`toast ${type}`;el.textContent=message;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.hidden=true},3500)}
    function getQuestion(){return questions[questionIndex]||questions[0]||{pertanyaan:'Tambahkan soal terlebih dahulu',opsi:{A:'',B:'',C:'',D:''},kunci:'A'};}
    function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function configPanel(){return `<div class="card"><h2>Sambungan Supabase</h2><p class="muted">Isi URL proyek dan publishable key dari proyek KATEPEL. Pengaturan tersimpan di browser perangkat ini. Jangan gunakan secret key.</p><div class="grid cols2"><div class="field"><label>Project URL</label><input id="cfgUrl" type="url" placeholder="https://xxxx.supabase.co" value="${escapeHtml(cfgUrl())}"></div><div class="field"><label>Publishable key</label><input id="cfgKey" type="password" placeholder="sb_publishable_…" value="${escapeHtml(cfgKey())}"></div></div><div class="row"><button class="btn" id="saveConfig">Simpan sambungan</button><span class="status">${escapeHtml(status)}</span></div></div>`}
    function connect(url,key){try{if(!window.supabase||!url||!key)throw Error('Isi URL proyek dan publishable key.');client=window.supabase.createClient(url.trim(),key.trim());localStorage.setItem('katepel_supabase_url',url.trim());localStorage.setItem('katepel_supabase_key',key.trim());return true}catch(e){status=e.message;return false}}
    if(cfgUrl()&&cfgKey())connect(cfgUrl(),cfgKey());
    function bindConfig(){const b=$('saveConfig');if(b)b.onclick=()=>{const ok=connect($('cfgUrl').value,$('cfgKey').value);status=ok?'Tersimpan. Mencoba sambungan…':status;if(ok&&roomCode){view='host';startHostRoom(roomCode)}else if(ok&&phoneRoom&&phoneTeam){view='phone';joinPhone(phoneRoom,phoneTeam)}else render()}}
    function makeCode(){return String(Math.floor(10000000+Math.random()*90000000))}
    function hostPayload(){return {questionIndex,checked,finished,teams:teams.map(t=>({id:t.id,name:t.name,answer:t.answer,result:t.result,score:t.score}))}}
    function broadcastState(){if(channel&&channelReady)channel.send({type:'broadcast',event:'state',payload:hostPayload()})}
    function startHostRoom(code){if(!client){status='Sambungkan Supabase dahulu.';render();return}if(channel)client.removeChannel(channel);roomCode=code;channelReady=false;status='Menyambungkan…';channel=client.channel(`katepel-room-${code}`,{config:{broadcast:{self:false}}});
      channel.on('broadcast',{event:'answer'},({payload})=>{const t=teams.find(x=>x.id===payload.teamId);if(!t||checked||finished||t.answer)return;t.answer=payload.answer;t.result='waiting';broadcastState();render()});
      channel.on('broadcast',{event:'join'},()=>broadcastState());
      channel.subscribe((s,err)=>{if(s==='SUBSCRIBED'){channelReady=true;status='Tersambung ke Supabase';broadcastState()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){channelReady=false;status=`Gagal tersambung (${s}). Periksa URL proyek, publishable key, atau jaringan.`;if(err)console.error(err)}else status=s;render()});render()
    }
    function createRoom(){if(!questions.length){status='Tambahkan soal terlebih dahulu.';render();return}questionIndex=0;checked=false;finished=false;teams.forEach(t=>{t.answer=null;t.result='waiting';t.score=0});startHostRoom(makeCode())}
    function joinPhone(code,teamId){if(!client){status='Sambungkan Supabase dahulu.';render();return}if(channel)client.removeChannel(channel);phoneRoom=code;phoneTeam=teamId;phoneReady=false;phoneHasState=false;phoneLocked=false;status='Menghubungkan HP…';channel=client.channel(`katepel-room-${code}`,{config:{broadcast:{self:false}}});
      channel.on('broadcast',{event:'state'},({payload})=>{phoneQuestionIndex=payload.questionIndex;phoneHasState=true;teams=payload.teams.map(t=>({...t}));const own=teams.find(t=>t.id===phoneTeam);phoneLocked=Boolean(own?.answer)||payload.checked||payload.finished;checked=payload.checked;finished=payload.finished;status='Tersambung ke ruang kuis';render()});
      channel.subscribe((s,err)=>{if(s==='SUBSCRIBED'){phoneReady=true;status='Menunggu layar proyektor…';channel.send({type:'broadcast',event:'join',payload:{teamId:phoneTeam}})}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'){phoneReady=false;status=`Gagal tersambung (${s}). Periksa URL proyek, publishable key, atau jaringan.`;if(err)console.error(err)}render()});render()
    }
    async function sendAnswer(letter){if(!channel||!phoneReady||!phoneHasState||phoneLocked)return;phoneLocked=true;render();const result=await channel.send({type:'broadcast',event:'answer',payload:{teamId:phoneTeam,answer:letter}});if(result!=='ok'){phoneLocked=false;status='Jawaban belum terkirim. Coba lagi.';render()}}
    function checkAnswers(){if(checked||finished)return;const q=getQuestion();teams=teams.map(t=>t.answer?{...t,result:t.answer===q.kunci?'correct':'wrong',score:t.score+(t.answer===q.kunci?10:0)}:t);checked=true;broadcastState();render()}
    function nextQuestion(){if(!checked)return;if(questionIndex>=questions.length-1)finished=true;else questionIndex++;teams=teams.map(t=>({...t,answer:null,result:'waiting'}));checked=false;broadcastState();render()}
    function resetQuiz(){questionIndex=0;checked=false;finished=false;teams=teams.map(t=>({...t,answer:null,result:'waiting',score:0}));broadcastState();render()}
    function renderQuestions(){
      $('app').innerHTML=`<div class="notice">Kelola soal dari laptop. Soal dan pilihan tampil di proyektor; HP peserta hanya menampilkan tombol A, B, C, D.</div>
        <div class="manage-layout"><section class="card manage-card"><h1>${editingId?'Edit soal':'Tambah soal'}</h1><div class="field"><label>Pertanyaan</label><textarea id="qText" placeholder="Tulis pertanyaan">${editingId?escapeHtml(questions.find(q=>q.id===editingId)?.pertanyaan||''):''}</textarea></div><div class="grid cols2">${LETTERS.map(l=>`<div class="field"><label>Pilihan ${l}</label><input id="opt${l}" value="${editingId?escapeHtml(questions.find(q=>q.id===editingId)?.opsi?.[l]||''):''}" placeholder="Tulis jawaban ${l}"></div>`).join('')}</div><div class="grid cols2"><div class="field"><label>Kunci jawaban</label><select id="qKey">${LETTERS.map(l=>`<option value="${l}" ${editingId&&questions.find(q=>q.id===editingId)?.kunci===l?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Gambar (opsional)</label><input id="qImage" type="file" accept="image/*"></div></div><div class="row right form-actions"><button class="btn secondary" id="cancelEdit">Bersihkan</button><button class="btn" id="saveQuestion">${editingId?'Simpan perubahan':'Tambah ke bank soal'}</button></div></section>
        <aside class="card manage-card"><h2 class="import-title">IMPORT SOAL</h2><div class="field"><input class="import-file" id="importFile" type="file" accept=".txt,text/plain" aria-label="Pilih file soal untuk diimpor"></div><button class="btn secondary" id="downloadTemplate">Unduh template</button><h2 class="bank-title">Bank soal (${questions.length})</h2><div class="questionlist">${questions.map((q,i)=>`<div class="qrow"><div><b>Soal ${i+1}</b><p>${escapeHtml(q.pertanyaan)}</p><small>Kunci ${escapeHtml(q.kunci)}</small></div><div class="row"><button class="btn secondary" data-edit="${q.id}">Edit</button><button class="btn red" data-delete="${q.id}">Hapus</button></div></div>`).join('')||'<p class="muted">Belum ada soal.</p>'}</div></aside></div>`;
      $('cancelEdit').onclick=()=>{editingId=null;render()};$('saveQuestion').onclick=async()=>{const text=$('qText').value.trim(),opts=Object.fromEntries(LETTERS.map(l=>[l,$(`opt${l}`).value.trim()]));if(!text||LETTERS.some(l=>!opts[l])){toast('Lengkapi pertanyaan dan semua pilihan A–D.','error');return}let image=editingId?questions.find(q=>q.id===editingId)?.gambar||'':'';const f=$('qImage').files[0];if(f)image=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)});const q={id:editingId||Date.now(),pertanyaan:text,gambar:image,opsi:opts,kunci:$('qKey').value};const wasEdit=Boolean(editingId);questions=wasEdit?questions.map(x=>x.id===editingId?q:x):[...questions,q];editingId=null;saveQuestions();render();toast(wasEdit?'Perubahan soal disimpan.':'Soal ditambahkan ke bank.')};
      document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editingId=Number(b.dataset.edit);render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.delete);const q=questions.find(x=>x.id===id);if(b.dataset.confirm==='yes'){questions=questions.filter(x=>x.id!==id);saveQuestions();render();toast('Soal dihapus.')}else{b.dataset.confirm='yes';b.textContent='Yakin?';b.title=`Klik lagi untuk menghapus ${q?.pertanyaan||'soal ini'}`}});
      $('downloadTemplate').onclick=()=>{const txt='PERTANYAAN: Tulis pertanyaan di sini?\nOPSI_A: Jawaban A\nOPSI_B: Jawaban B\nOPSI_C: Jawaban C\nOPSI_D: Jawaban D\nKUNCI: A\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));a.download='Template_Soal_KATEPEL.txt';a.click();URL.revokeObjectURL(a.href)};
      $('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;const txt=await file.text();const chunks=txt.split(/PERTANYAAN:/i).slice(1);const add=chunks.map((chunk,i)=>{const lines=chunk.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const get=(prefix,fallback='')=>lines.find(s=>s.toUpperCase().startsWith(prefix+':'))?.slice(prefix.length+1).trim()||fallback;return {id:Date.now()+i,pertanyaan:(lines[0]||'').trim(),gambar:'',opsi:{A:get('OPSI_A'),B:get('OPSI_B'),C:get('OPSI_C'),D:get('OPSI_D')},kunci:get('KUNCI','A').toUpperCase()}}).filter(q=>q.pertanyaan&&LETTERS.every(l=>q.opsi[l]));if(!add.length){toast('Format tidak cocok. Pastikan ada pertanyaan, opsi A–D, dan kunci.','error');return}questions=[...questions,...add];saveQuestions();render();toast(`${add.length} soal berhasil ditambahkan.`)};
    }
function renderHost(){
  const setup=client?'':configPanel();

  if(!roomCode){
    $('app').innerHTML=`${setup}<div class="card"><h1>Layar Proyektor</h1><p class="muted">Mulai kuis memakai soal dari Bank Soal KATEPEL (${questions.length} soal). Peserta bergabung dari HP.</p><p class="muted">Kelompok yang bermain: <b>Sudut Merah</b> dan <b>Sudut Kuning</b>.</p><div class="row right"><button class="btn" id="createRoom" ${client&&questions.length?'':'disabled'}>Buat ruang kuis</button></div><div class="status">${escapeHtml(status)}</div></div>`;
    bindConfig();
    $('createRoom').onclick=createRoom;
    return;
  }

  if(finished){
    const winner=teams[0].score===teams[1].score
      ?'Hasil seri'
      :`${teams[0].score>teams[1].score?teams[0].name:teams[1].name} menang`;

    $('app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h1>Kuis selesai</h1><div class="pill">KODE ${roomCode}</div></div><h2 style="text-align:center;margin:25px">${escapeHtml(winner)}</h2><div class="teamgrid">${teams.map(t=>`<div class="team ${t.id}"><div class="teamname">${escapeHtml(t.name)}</div><div class="score">${t.score} poin</div></div>`).join('')}</div><div class="row right" style="margin-top:16px"><button class="btn secondary" id="resetQuiz">Ulangi kuis</button><button class="btn red" id="endRoom">Tutup ruang</button></div></div>`;

    $('resetQuiz').onclick=resetQuiz;
    $('endRoom').onclick=()=>{
      if(channel&&client)client.removeChannel(channel);
      channel=null;
      roomCode='';
      channelReady=false;
      status='Ruang ditutup';
      render();
    };
    return;
  }

  const q=getQuestion();

  $('app').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h1>Layar Proyektor</h1><span class="muted">Kode ini dibagikan ke HP peserta.</span></div><div class="pill">KODE ${roomCode}<br><small>${escapeHtml(status)}</small></div></div><h2 style="margin-top:18px">Soal ${questionIndex+1} / ${questions.length}</h2><p class="question">${escapeHtml(q.pertanyaan)}</p>${q.gambar?`<div style="text-align:center;margin:10px"><img src="${q.gambar}" alt="Ilustrasi soal" style="max-height:180px;max-width:100%;object-fit:contain"></div>`:''}<div class="choices">${LETTERS.map(l=>`<div class="choice"><b>${l}.</b>${escapeHtml(q.opsi[l])}</div>`).join('')}</div><div class="teamgrid">${teams.map(t=>`<div class="team ${t.id}"><div class="teamname">${escapeHtml(t.name)}</div><div class="teamstate" style="${t.answer?'text-align:center;font-size:clamp(1.25rem,2.4vw,1.9rem);font-weight:900;min-height:2.7em;display:grid;place-items:center;':''}">${t.result==='correct'?'Benar':t.result==='wrong'?'Salah':t.answer?'Sudah Menjawab':'Menunggu Jawaban'}</div><div class="score">${t.score} poin</div></div>`).join('')}</div><div class="row right" style="margin-top:15px"><button class="btn" id="check" ${checked||!teams.some(t=>t.answer)?'disabled':''}>Periksa jawaban</button><button class="btn secondary" id="next" ${!checked?'disabled':''}>${questionIndex===questions.length-1?'Lihat hasil':'Soal selanjutnya'}</button><button class="btn secondary" id="endRoom">Tutup ruang</button></div></div>`;

  $('check').onclick=checkAnswers;
  $('next').onclick=nextQuestion;
  $('endRoom').onclick=()=>{
    if(channel&&client)client.removeChannel(channel);
    channel=null;
    roomCode='';
    channelReady=false;
    status='Ruang ditutup';
    render();
  };
}
    function renderSettings(){ $('app').hidden=false;$('phoneRoot').hidden=true;$('app').innerHTML=`${configPanel()}<div class="card"><p class="muted">Gunakan URL proyek yang berakhiran <b>.supabase.co</b> dan kunci <b>Publishable</b>.</p><button class="btn secondary" id="settingsBack">Kembali</button></div>`;bindConfig();$('settingsBack').onclick=()=>setView('host') }
    let projectorZoom = Math.min(
  1,
  Math.max(0.6, Number(load('katepel_projector_zoom', 1)) || 1)
);

function applyProjectorZoom() {
  document.documentElement.style.setProperty('--projector-density', String(projectorZoom));
  localStorage.setItem('katepel_projector_zoom', String(projectorZoom));

  const value = $('zoomValue');
  if (value) value.textContent = `${Math.round(projectorZoom * 100)}%`;
}

function changeProjectorZoom(amount) {
  projectorZoom = Math.min(
    1,
    Math.max(0.6, Math.round((projectorZoom + amount) * 100) / 100)
  );
  applyProjectorZoom();
}

function renderDisplaySettings() {
  $('app').innerHTML = `
    <div class="card">
      <h1>Atur Tampilan</h1>
      <p class="muted">Rapatkan jarak vertikal agar pas di PID. Ukuran tulisan dan lebar tetap.</p>
      <div class="zoom-controls">
        <button class="btn secondary" id="zoomOut">− Rapatkan</button>
        <span class="zoom-value" id="zoomValue"></span>
        <button class="btn" id="zoomIn">+ Longgarkan</button>
        <button class="btn secondary" id="zoomReset">Reset</button><button class="btn secondary" id="toggleFullscreen">Layar penuh</button>
      </div>
      <p class="muted">Klik Layar Proyektor untuk melihat hasilnya.</p>
    </div>`;

  applyProjectorZoom();
  $('zoomOut').onclick = () => changeProjectorZoom(-0.05);
  $('zoomIn').onclick = () => changeProjectorZoom(0.05);
  $('zoomReset').onclick = () => {
    projectorZoom = 1;
    applyProjectorZoom();
  };
  $('toggleFullscreen').onclick = async () => {
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen();
    }
  } catch {
    toast('Mode layar penuh gagal dibuka. Coba tombol F11.', 'error');
  }
};
}
    function renderPhone(){
      $('header').hidden=false;
      $('app').hidden=true;$('phoneRoot').hidden=false;
      if(!client){$('phoneRoot').innerHTML=`${configPanel()}<div class="card"><h1>Gabung kuis</h1><p class="muted">Sambungkan Supabase di HP ini, kemudian masukkan kode dari proyektor.</p>${joinForm()}</div>`;bindConfig();bindJoinForm();return}
      if(!phoneRoom){$('phoneRoot').innerHTML=`<main>${joinForm()}</main>`;bindJoinForm();return}
      if(!phoneTeam){$('phoneRoot').innerHTML=`<main><div class="card"><h1>Pilih kelompok</h1><div class="teamgrid"><button class="btn red" id="chooseRed">${escapeHtml(teams[0].name)}</button><button class="btn" style="background:#e1c900;color:#171717" id="chooseYellow">${escapeHtml(teams[1].name)}</button></div><p class="status">${escapeHtml(status)}</p></div></main>`;$('chooseRed').onclick=()=>joinPhone(phoneRoom,'merah');$('chooseYellow').onclick=()=>joinPhone(phoneRoom,'kuning');return}
      if(!phoneReady||!phoneHasState){$('phoneRoot').innerHTML=`<div class="phone-wait"><div><h1>${phoneReady?'Menunggu layar proyektor…':'HP belum tersambung'}</h1><p>${escapeHtml(teams.find(t=>t.id===phoneTeam)?.name||'')}</p><p class="warning">${escapeHtml(status)}</p><button class="btn" id="retryJoin">Coba sambungkan lagi</button><button class="btn secondary" id="backJoin">Kembali</button></div></div>`;$('retryJoin').onclick=()=>joinPhone(phoneRoom,phoneTeam);$('backJoin').onclick=()=>{phoneRoom='';phoneTeam='';phoneReady=false;phoneHasState=false;render()};return}
      const own=teams.find(t=>t.id===phoneTeam);const yellow=phoneTeam==='kuning';$('header').hidden=true;$('phoneRoot').innerHTML=`<div class="phone ${yellow?'yellow':''}"><div class="mark">K</div><div class="wordmark">KATEPEL</div><div class="tagline">Kuis Alternatif Terpadu Pembelajaran</div><div class="answerpad">${LETTERS.map(l=>`<button class="key" data-answer="${l}" ${phoneLocked||!phoneReady||own?.answer||checked||finished?'disabled':''}>${l}</button>`).join('')}</div><p class="instruction">Diskusikan dengan baik<br>agar jawaban tepat dan benar</p><div class="bubble" aria-hidden="true">💬<br>👥</div></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>sendAnswer(b.dataset.answer));
    }
    function joinForm(){return `<div class="card"><h1>Gabung kuis</h1><p class="muted">Masukkan kode dari layar proyektor, lalu pilih kelompok.</p><div class="join"><input id="roomInput" inputmode="numeric" maxlength="8" placeholder="Kode ruang 8 digit"><button class="btn" id="joinButton">Gabung</button></div><p class="status">${escapeHtml(status)}</p></div>`}
    function bindJoinForm(){const b=$('joinButton');if(b)b.onclick=()=>{const c=$('roomInput').value.trim();if(!/^\d{8}$/.test(c)){status='Masukkan kode 8 digit dari proyektor.';render();return}phoneRoom=c;phoneTeam='';render()}}
    function render() {
  if (view === 'questions') renderQuestions();
  else if (view === 'host') renderHost();
  else if (view === 'phone') renderPhone();
  else if (view === 'display') renderDisplaySettings();
  else renderSettings();
}
    function setView(v) {
  view = v;
  document.body.classList.toggle('projector-view', v === 'host');

  $('header').hidden = false;
  $('navQuestions').classList.toggle('active', v === 'questions');
  $('navHost').classList.toggle('active', v === 'host');
  $('navPhone').classList.toggle('active', v === 'phone');
  $('navDisplay').classList.toggle('active', v === 'display');
  $('navSettings').classList.toggle('active', v === 'settings');

  $('app').hidden = v === 'phone';
  $('phoneRoot').hidden = v !== 'phone';

  if (v === 'questions') renderQuestions();
  else if (v === 'host') renderHost();
  else if (v === 'phone') renderPhone();
  else if (v === 'display') renderDisplaySettings();
  else renderSettings();
}
    $('navQuestions').onclick=()=>setView('questions');$('navHost').onclick=()=>setView('host');$('navPhone').onclick=()=>{phoneRoom='';phoneTeam='';phoneReady=false;phoneHasState=false;setView('phone')};$('navDisplay').onclick=()=>setView('display');$('navSettings').onclick=()=>setView('settings');
    document.addEventListener('fullscreenchange', () => {
  const button = $('toggleFullscreen');
  if (button) {
    button.textContent = document.fullscreenElement
      ? 'Kembali normal'
      : 'Layar penuh';
  }
});  renderQuestions();
  })();
  </script>
</body>
</html>
