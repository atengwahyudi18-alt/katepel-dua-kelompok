<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#075c47">
  <title>KATEPEL · Kuis Dua Kelompok</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#17212b;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.topbar{background:#075c47;color:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.04em}.nav{display:flex;gap:8px}.nav button,.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.nav button{background:#08765a;color:#fff}.nav button.active{background:#f5a623;color:#17212b}.btn{background:#087f5b;color:#fff}.btn.dark{background:#53616b}.btn:disabled{opacity:.5;cursor:not-allowed}main{max-width:1100px;margin:22px auto;padding:0 15px 30px}.panel{background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 22px #17212b12;margin-bottom:14px}.notice{background:#fff5d8;border:1px solid #edcb6c;color:#694d08;border-radius:11px;padding:12px 14px;line-height:1.45;margin-bottom:15px}.muted{color:#687784;line-height:1.5}h1{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 8px}h2{margin:0 0 9px}.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.config-grid input,.join-row input{width:100%;border:1px solid #cbd5dc;border-radius:9px;padding:11px}.question-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.counter{background:#e7f3ee;color:#075c47;border-radius:999px;padding:7px 12px;font-weight:900;white-space:nowrap}.question{font-size:clamp(1.15rem,2.4vw,1.7rem);line-height:1.4;margin:16px 0}.choices,.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.choice{background:#f7f9fa;border:1px solid #d8e0e5;padding:13px;border-radius:10px;line-height:1.45}.choice b{color:#075c47;min-width:27px;display:inline-block}.team{border:2px solid #d8e0e5;border-radius:12px;padding:14px}.team.waiting{background:#fff9e7;border-color:#e7bb49}.team.correct{background:#e8f7ef;border-color:#46a37e}.team.wrong{background:#fff0f0;border-color:#dc7474}.team-name{font-size:1.05rem;font-weight:900}.team-state{margin-top:8px;color:#53616b}.score{margin-top:7px;color:#087f5b;font-weight:900}.actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:16px}.join-row{display:flex;gap:8px;margin-top:15px}.status{margin-top:10px;font-size:.9rem;color:#53616b}.pick-team{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.pick-team button{border:0;border-radius:12px;padding:18px;color:#fff;font-weight:900;background:#e20c12}.pick-team button:last-child{background:#fff000;color:#191919}.phone-playing .topbar,.phone-playing .notice{display:none}.phone-playing main{max-width:none;margin:0;padding:0}.phone-playing #phoneView{height:100vh}.phone-device{min-height:100vh;padding:10px;background:#f20c0c;display:flex;flex-direction:column;align-items:center;justify-content:space-between}.phone-device.kuning{background:#fff400}.phone-logo{display:flex;flex-direction:column;align-items:center;margin-top:1.5vh;font-weight:1000;color:#fff;font-size:1.3rem;letter-spacing:.04em;text-shadow:0 2px 2px #0005}.phone-device.kuning .phone-logo{color:#075c47}.logo-mark{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#075c47 0 42%,#ffc928 44% 55%,#188363 57% 72%,#ffc928 74%);border:3px solid #ffc928;color:#fff;font-size:2.4rem}.phone-logo small{font-size:.43rem;letter-spacing:0;text-shadow:none}.answer-pad{width:min(100%,400px);height:min(45vh,540px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:7px;margin-top:auto}.answer-key{appearance:none;border:3px solid #ffffff75;border-radius:17px;color:#08090b;font-size:clamp(4.5rem,22vw,6.3rem);font-weight:1000;line-height:1;text-shadow:0 1px 0 #ffffff55;box-shadow:inset 0 3px 0 #ffffff45,inset 0 -5px 0 #00000012,0 6px 0 #00000024,0 10px 18px #0000001c;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}.answer-key:nth-child(1){background:linear-gradient(145deg,#f779c0,#e85da9)}.answer-key:nth-child(2){background:linear-gradient(145deg,#4be88a,#2fce71)}.answer-key:nth-child(3){background:linear-gradient(145deg,#70b1ff,#4e91eb)}.answer-key:nth-child(4){background:linear-gradient(145deg,#ffa04d,#f47e2d)}.answer-key:active{transform:translateY(5px) scale(.985);box-shadow:inset 0 2px 0 #ffffff35,0 1px 0 #00000020,0 3px 8px #00000018}.answer-key:disabled{opacity:1;filter:saturate(.55)}.phone-instruction{text-align:center;margin:9px 0 0;color:#090909;font-size:clamp(.75rem,3.3vw,1rem);font-weight:900;line-height:1.5;text-transform:uppercase}.phone-icon{font-size:2.35rem;line-height:1;margin:4px 0 1vh}.winner{text-align:center;font-size:1.4rem;font-weight:900;color:#087f5b;padding:14px}.hidden{display:none!important}@media(max-width:620px){.topbar{padding:11px}.panel{padding:16px}main{margin:14px auto;padding:0 10px 24px}.choices,.teams,.config-grid{grid-template-columns:1fr}.answer-pad{height:43vh;gap:6px}.answer-key{border-radius:15px}.join-row{flex-direction:column}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">KATEPEL · KUIS DUA KELOMPOK</div><nav class="nav"><button id="navProjector" class="active" type="button">Layar Proyektor</button><button id="navPhone" type="button">Layar HP</button></nav></header>
  <main>
    <div id="setupNotice" class="notice">Untuk menyambungkan dua HP sungguhan, masukkan URL proyek dan publishable key Supabase. Nilai ini disimpan di browser masing-masing perangkat.</div>
    <section id="projectorView"></section>
    <section id="phoneView" hidden></section>
  </main>
  <script>
    const questions=[
      {text:"Apa masalah utama yang dihadapi Kancil dalam cerita?",options:{A:"Kancil tidak punya teman",B:"Kancil kesulitan menyeberangi sungai",C:"Buah rambutan terasa masam",D:"Kancil tersesat di hutan"},answer:"B"},
      {text:"Apa yang sebaiknya dilakukan sebelum menyeberangi sungai deras?",options:{A:"Langsung melompat",B:"Meminta bantuan dan mencari tempat aman",C:"Menutup mata",D:"Berlari secepatnya"},answer:"B"},
      {text:"Sikap baik apa yang dapat dipelajari dari bekerja bersama?",options:{A:"Saling membantu",B:"Menyalahkan teman",C:"Bekerja sendiri",D:"Tidak mendengarkan"},answer:"A"}
    ];
    const teams=[{id:"merah",name:"Sudut Merah",score:0,answer:null,result:"waiting"},{id:"kuning",name:"Sudut Kuning",score:0,answer:null,result:"waiting"}];
    const $=id=>document.getElementById(id);
    let client=null,channel=null,roomCode="",questionIndex=0,checked=false,finished=false,phoneTeamId=null,phoneLocked=false,view="projector",roomReady=false,liveStatus="Belum tersambung";
    let phoneRoomCode="";
    const savedUrl=localStorage.getItem("katepel_supabase_url")||"";
    const savedKey=localStorage.getItem("katepel_supabase_key")||"";
    function configureSupabase(url,key){
      if(!window.supabase||!url||!key)return false;
      try{client=window.supabase.createClient(url.trim(),key.trim());localStorage.setItem("katepel_supabase_url",url.trim());localStorage.setItem("katepel_supabase_key",key.trim());return true;}catch(error){console.error(error);return false;}
    }
    if(savedUrl&&savedKey)configureSupabase(savedUrl,savedKey);
    function setView(next){view=next;$("projectorView").hidden=next!=="projector";$('phoneView').hidden=next!=="phone";$('navProjector').classList.toggle("active",next==="projector");$('navPhone').classList.toggle("active",next==="phone");document.body.classList.remove("phone-playing");render();}
    function renderSetup(){
      if(client)return "";
      return `<div class="panel"><h2>Hubungkan layanan realtime</h2><p class="muted">Masukkan URL proyek dan publishable key dari Supabase. Publishable key memang untuk dipakai di aplikasi browser; jangan gunakan secret key.</p><div class="config-grid"><input id="supabaseUrl" type="url" placeholder="https://xxxx.supabase.co" value="${savedUrl}"><input id="supabaseKey" type="password" placeholder="sb_publishable_…" value="${savedKey}"></div><div class="actions"><button class="btn" id="saveConfig">Simpan sambungan</button></div><div id="configStatus" class="status">${liveStatus}</div></div>`;
    }
    function makeRoomCode(){return String(Math.floor(10000000+Math.random()*90000000));}
    function subscribeHost(code){
      roomCode=code;channel=client.channel(`katepel-room-${code}`,{config:{broadcast:{self:false}}});
      channel.on("broadcast",{event:"answer"},({payload})=>{const team=teams.find(t=>t.id===payload.teamId);if(!team||checked||team.answer)return;team.answer=payload.answer;team.result="waiting";broadcastState();render();});
      channel.on("broadcast",{event:"join"},()=>broadcastState());
      channel.subscribe(status=>{liveStatus=status;if(status==="SUBSCRIBED"){roomReady=true;broadcastState();render();}else render();});
    }
    function broadcastState(){if(!channel||!roomReady)return;channel.send({type:"broadcast",event:"state",payload:{questionIndex,teams,checked,finished}});}
    function createRoom(){if(!client){render();return;}if(channel)client.removeChannel(channel);roomReady=false;teams.forEach(t=>{t.answer=null;t.result="waiting";t.score=0;});questionIndex=0;checked=false;finished=false;subscribeHost(makeRoomCode());}
    function joinRoom(code){if(!client){render();return;}if(channel)client.removeChannel(channel);phoneRoomCode=code.trim();phoneLocked=false;channel=client.channel(`katepel-room-${phoneRoomCode}`,{config:{broadcast:{self:false}}});
      channel.on("broadcast",{event:"state"},({payload})=>{questionIndex=payload.questionIndex;checked=payload.checked;finished=payload.finished;payload.teams.forEach(incoming=>{const local=teams.find(t=>t.id===incoming.id);if(local)Object.assign(local,incoming);});const own=teams.find(t=>t.id===phoneTeamId);phoneLocked=Boolean(own?.answer)||checked||finished;render();});
      channel.subscribe(status=>{liveStatus=status;if(status==="SUBSCRIBED"){roomReady=true;channel.send({type:"broadcast",event:"join",payload:{teamId:phoneTeamId}});render();}else render();});
    }
    function sendAnswer(letter){if(!channel||!roomReady||!phoneTeamId||phoneLocked)return;phoneLocked=true;renderPhone();channel.send({type:"broadcast",event:"answer",payload:{teamId:phoneTeamId,answer:letter}});}
    function checkAnswers(){teams.forEach(team=>{if(!team.answer)return;team.result=team.answer===questions[questionIndex].answer?"correct":"wrong";if(team.result==="correct")team.score+=10;});checked=true;broadcastState();render();}
    function nextQuestion(){if(questionIndex===questions.length-1)finished=true;else questionIndex++;teams.forEach(team=>{team.answer=null;team.result="waiting";});checked=false;broadcastState();render();}
    function restartQuiz(){questionIndex=0;checked=false;finished=false;teams.forEach(t=>{t.answer=null;t.result="waiting";t.score=0;});broadcastState();render();}
    function renderProjector(){
      const setup=renderSetup();
      if(!roomCode){$('projectorView').innerHTML=`${setup}<div class="panel"><h1>Layar Proyektor</h1><p class="muted">Buat ruang kuis. Kode yang muncul dibagikan kepada dua HP peserta.</p><div class="actions"><button class="btn" id="createRoom" ${client?"":"disabled"}>Buat ruang kuis</button></div></div>`;if($('saveConfig'))$('saveConfig').onclick=()=>{const ok=configureSupabase($('supabaseUrl').value,$('supabaseKey').value);liveStatus=ok?"Tersambung ke Supabase":"Periksa URL dan publishable key";render();};if($('createRoom'))$('createRoom').onclick=createRoom;return;}
      if(finished){const winner=teams[0].score===teams[1].score?"Seri!":`${teams[0].score>teams[1].score?teams[0].name:teams[1].name} menang!`;$('projectorView').innerHTML=`<div class="panel"><div class="question-head"><h1>Kuis selesai</h1><span class="counter">Kode ${roomCode}</span></div><div class="winner">${winner}</div><div class="teams">${teams.map(t=>`<div class="team"><div class="team-name">${t.name}</div><div class="score">${t.score} poin</div></div>`).join("")}</div><div class="actions"><button class="btn dark" id="resetQuiz">Ulangi kuis</button></div></div>`;$('resetQuiz').onclick=restartQuiz;return;}
      const q=questions[questionIndex];$('projectorView').innerHTML=`<div class="panel"><div class="question-head"><div><h1>Layar Proyektor</h1><div class="muted">Bagikan kode ini kepada peserta di kedua HP.</div></div><div class="counter">KODE ${roomCode}<br><small>${liveStatus}</small></div></div><div class="question-head" style="margin-top:20px"><h2>Soal ${questionIndex+1} / ${questions.length}</h2></div><p class="question">${q.text}</p><div class="choices">${["A","B","C","D"].map(letter=>`<div class="choice"><b>${letter}.</b>${q.options[letter]}</div>`).join("")}</div><div class="teams" style="margin-top:16px">${teams.map(t=>{const cls=t.result==="correct"?"correct":t.result==="wrong"?"wrong":t.answer?"waiting":"";const state=t.result==="correct"?`Benar · ${t.answer}`:t.result==="wrong"?`Kurang tepat · ${t.answer}`:t.answer?`Sudah menjawab · ${t.answer}`:"Menunggu jawaban";return `<div class="team ${cls}"><div class="team-name">${t.name}</div><div class="team-state">${state}</div><div class="score">${t.score} poin</div></div>`;}).join("")}</div><div class="actions"><button class="btn" id="checkAnswers" ${checked||!teams.some(t=>t.answer)?"disabled":""}>Periksa jawaban</button><button class="btn dark" id="nextQuestion" ${!checked?"disabled":""}>${questionIndex===questions.length-1?"Lihat hasil":"Soal selanjutnya"}</button></div></div>`;$('checkAnswers').onclick=checkAnswers;$('nextQuestion').onclick=nextQuestion;
    }
    function renderPhone(){
      if(!phoneRoomCode){document.body.classList.remove("phone-playing");$('phoneView').innerHTML=`${renderSetup()}<div class="panel"><h1>Gabung kuis</h1><p class="muted">Masukkan kode dari layar proyektor, lalu pilih kelompok.</p><div class="join-row"><input id="joinCode" inputmode="numeric" maxlength="8" placeholder="Kode ruang 8 digit"><button class="btn" id="joinRoom">Gabung</button></div><div id="joinStatus" class="status">${liveStatus}</div></div>`;if($('saveConfig'))$('saveConfig').onclick=()=>{const ok=configureSupabase($('supabaseUrl').value,$('supabaseKey').value);liveStatus=ok?"Tersambung ke Supabase":"Periksa URL dan publishable key";render();};$('joinRoom').onclick=()=>{phoneRoomCode=$('joinCode').value;renderPhone();};return;}
      if(!phoneTeamId){document.body.classList.remove("phone-playing");$('phoneView').innerHTML=`<div class="panel"><h2>Pilih kelompok</h2><div class="pick-team"><button id="pickMerah">Sudut Merah</button><button id="pickKuning">Sudut Kuning</button></div><div class="status">${liveStatus}</div></div>`;$('pickMerah').onclick=()=>{phoneTeamId="merah";joinRoom(phoneRoomCode);};$('pickKuning').onclick=()=>{phoneTeamId="kuning";joinRoom(phoneRoomCode);};return;}
      document.body.classList.add("phone-playing");const team=teams.find(t=>t.id===phoneTeamId);$('phoneView').innerHTML=`<div class="phone-device ${phoneTeamId}"><div class="phone-logo"><div class="logo-mark">K</div><span>KATEPEL</span><small>Kuis Alternatif Terpadu Pembelajaran</small></div><div class="answer-pad">${["A","B","C","D"].map(letter=>`<button class="answer-key" data-answer="${letter}" ${phoneLocked||team.answer||checked||finished?"disabled":""}>${letter}</button>`).join("")}</div><p class="phone-instruction">Diskusikan dengan baik<br>agar jawaban tepat dan benar</p><div class="phone-icon" aria-hidden="true">💬<br>👥</div></div>`;$('phoneView').querySelectorAll("[data-answer]").forEach(button=>button.onclick=()=>sendAnswer(button.dataset.answer));
    }
    function render(){if(view==="projector")renderProjector();else renderPhone();}
    $('navProjector').onclick=()=>setView("projector");$('navPhone').onclick=()=>{phoneRoomCode="";phoneTeamId=null;phoneLocked=false;setView("phone");};
    document.addEventListener("keydown",event=>{if(event.key==="Escape"&&view==="phone"){phoneRoomCode="";phoneTeamId=null;phoneLocked=false;setView("projector");}});
    $('projectorView').hidden=false;$('phoneView').hidden=true;render();
  </script>
</body>
</html>
